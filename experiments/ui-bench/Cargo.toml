[package]
name = "forge-ui-bench"
version = "0.1.0"
edition = "2024"
publish = false

[features]
egui = ["dep:eframe"]

[dependencies]
eframe = { version = "=0.33.3", optional = true, default-features = false, features = ["glow", "default_fonts"] }
forge = { path = "../.." }

[[bin]]
name = "egui-bench"
path = "egui.rs"
required-features = ["egui"]

