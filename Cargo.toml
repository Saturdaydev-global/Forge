[package]
name = "forge"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
thiserror = "2.0.21"
tempfile = "3.27.0"
serde_json = "1.0.152"
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
# Official Agent Client Protocol SDK (Apache-2.0, MSRV 1.88). Pinned exactly.
agent-client-protocol = { version = "=3.3.0", features = ["process"] }
futures = { version = "=0.3.34", features = ["executor"] }
async-io = "=2.6.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Threading"] }
